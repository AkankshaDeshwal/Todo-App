<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=content_paste_go" />
    <title>To Do App</title>
</head>

<body>
    <div class="container">
        <div class="toDoApp">
            <h1>To Do App <span class="material-symbols-outlined">
                    content_paste_go
                </span></h1>
            <div class="row">
                <input type="text" id="inputBox" placeholder="Add task..." />
                <br>
                
                <button class="add_button" onClick="addTask()">Add Task</button>
                
                </div>
                <div class="emptyAlertDiv">
                    <span id="emptyAlert"></span>
                <br>
            </div>
            
            <div class="tasks">
                <ul id="taskList">
                <!-- <li class="checked">Task 1</li>
                <li>Task 2</li>
                <li>Task 3</li> -->
            </ul>
            </div>
        </div>



    </div>

    <script src="script.js"></script>
</body>

</html>
